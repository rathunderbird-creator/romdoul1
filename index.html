<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- maximum-scale=1 stops iOS from auto-zooming when an input is focused;
       pinch-to-zoom still works on iOS 10+ which ignores it for user gestures. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <!-- Fonts are self-hosted (src/index.css @font-face) — no request to Google
       Fonts, whose render-blocking CSS left the app blank on slow or filtered
       connections. Warm up the API origin instead: DNS + TLS to Supabase start
       while the JS bundle is still downloading. %VITE_SUPABASE_URL% is filled
       in by Vite from the build environment. -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
  <title>JBL POS System</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
